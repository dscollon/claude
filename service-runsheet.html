<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Runsheet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --surface:   #242424;
      --surface2:  #2e2e2e;
      --border:    #3a3a3a;
      --copper:    #c8763a;
      --copper-lt: #e0924f;
      --copper-dk: #9e5b28;
      --text:      #e8e8e8;
      --text-dim:  #888;
      --green:     #5ba08a;
      --red:       #c84a3a;
      --yellow:    #c8a03a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 24px 60px;
    }

    /* ── Header ── */
    .header {
      max-width: 960px;
      margin: 0 auto 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .header-left h1 {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 6px;
    }

    .header-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header-meta input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 5px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .header-meta input:focus { border-color: var(--copper-dk); }

    .clock {
      font-size: 1.4rem;
      font-weight: 200;
      letter-spacing: 0.08em;
      color: var(--copper-lt);
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn:hover { border-color: var(--copper-dk); color: var(--text); }
    .btn.primary { border-color: var(--copper-dk); color: var(--copper-lt); }
    .btn.primary:hover { background: rgba(200,118,58,0.1); }

    /* ── Table ── */
    .table-wrap {
      max-width: 960px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 11px 14px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.active-row { background: rgba(200,118,58,0.07); }
    tbody tr.past-row td { opacity: 0.45; }

    td {
      padding: 4px 6px;
      vertical-align: middle;
    }

    td.time-col  { width: 80px; }
    td.dur-col   { width: 64px; }
    td.item-col  { min-width: 160px; }
    td.person-col { width: 130px; }
    td.mic-col   { width: 120px; }
    td.slides-col { width: 140px; }
    td.notes-col { }
    td.del-col   { width: 36px; text-align: center; }

    /* Editable cells */
    .cell {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 5px 8px;
      width: 100%;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .cell:focus {
      border-color: var(--copper-dk);
      background: var(--surface2);
    }

    .cell.time-cell {
      font-variant-numeric: tabular-nums;
      color: var(--copper-lt);
      font-size: 0.82rem;
    }

    .cell.dur-cell {
      color: var(--text-dim);
      font-size: 0.82rem;
      text-align: center;
    }

    .cell.mic-cell { color: var(--green); font-size: 0.8rem; }
    .cell.slides-cell { color: var(--yellow); font-size: 0.8rem; }
    .cell.notes-cell { color: var(--text-dim); font-size: 0.8rem; }

    .del-btn {
      background: none;
      border: none;
      color: var(--border);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .del-btn:hover { color: var(--red); }

    /* Countdown chip */
    .countdown {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      margin-left: 6px;
      vertical-align: middle;
    }

    .countdown.upcoming { background: rgba(91,160,138,0.15); color: var(--green); }
    .countdown.live     { background: rgba(200,118,58,0.2);  color: var(--copper-lt); }
    .countdown.overrun  { background: rgba(200,74,58,0.2);   color: var(--red); }

    /* Add row button */
    .add-row {
      max-width: 960px;
      margin: 12px auto 0;
      display: flex;
    }

    /* ── Fullscreen / presenter mode ── */
    .presenter {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }

    .presenter.open { display: flex; }

    .presenter .p-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--copper);
    }

    .presenter .p-item {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 200;
      line-height: 1.2;
    }

    .presenter .p-person {
      font-size: 1.1rem;
      color: var(--text-dim);
    }

    .presenter .p-cues {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .presenter .p-cue {
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .presenter .p-cue.mic    { border-color: var(--green); color: var(--green); }
    .presenter .p-cue.slides { border-color: var(--yellow); color: var(--yellow); }

    .presenter .p-nav {
      position: absolute;
      bottom: 32px;
      display: flex;
      gap: 14px;
    }

    .presenter .p-clock {
      position: absolute;
      top: 28px;
      right: 36px;
      font-size: 1.8rem;
      font-weight: 200;
      color: var(--copper-lt);
      font-variant-numeric: tabular-nums;
    }

    .presenter .p-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--copper);
      transition: width 1s linear;
    }

    /* ── Print ── */
    @media print {
      body { background: white; color: black; padding: 16px; }
      .header-actions, .del-col, .del-btn, .add-row, .countdown { display: none !important; }
      .table-wrap { border: 1px solid #ccc; border-radius: 0; }
      thead th { color: #555; border-bottom: 1px solid #ccc; }
      tbody tr { border-bottom: 1px solid #eee; }
      .cell { color: black; font-size: 0.82rem; }
      .cell.time-cell  { color: #333; }
      .cell.mic-cell   { color: #2a6e5a; }
      .cell.slides-cell { color: #7a6020; }
      .cell.notes-cell { color: #555; }
      .header-left h1 { color: #c8763a; }
      .clock { display: none; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Service Runsheet</h1>
    <div class="header-meta">
      <input type="text" id="serviceTitle" value="Sunday Morning Service" style="width:200px">
      <input type="date" id="serviceDate">
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <div class="clock" id="clock">00:00:00</div>
    <div class="header-actions">
      <button class="btn primary" onclick="openPresenter()">⛶ Present</button>
      <button class="btn" onclick="window.print()">⎙ Print</button>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table id="runsheet">
    <thead>
      <tr>
        <th class="time-col">Time</th>
        <th class="dur-col">Dur.</th>
        <th class="item-col">Item</th>
        <th class="person-col">Person</th>
        <th class="mic-col">🎤 Mic</th>
        <th class="slides-col">🖥 Slides</th>
        <th class="notes-col">Notes</th>
        <th class="del-col"></th>
      </tr>
    </thead>
    <tbody id="tbody">
    </tbody>
  </table>
</div>

<div class="add-row">
  <button class="btn" onclick="addRow()">+ Add item</button>
</div>

<!-- Presenter overlay -->
<div class="presenter" id="presenter">
  <div class="p-progress" id="pProgress"></div>
  <div class="p-clock" id="pClock">00:00:00</div>
  <div class="p-label" id="pLabel">Up next</div>
  <div class="p-item" id="pItem">—</div>
  <div class="p-person" id="pPerson"></div>
  <div class="p-cues" id="pCues"></div>
  <div class="p-nav">
    <button class="btn" onclick="presenterNav(-1)">← Prev</button>
    <button class="btn" onclick="closePresenter()">✕ Close</button>
    <button class="btn" onclick="presenterNav(1)">Next →</button>
  </div>
</div>

<script>
  // ── Default data ──
  const DEFAULT_ROWS = [
    { time: '10:00', dur: '5',  item: 'Doors open / pre-service music', person: 'Sound team',   mic: 'BG music',         slides: 'Welcome loop',   notes: 'Fade in by 9:58' },
    { time: '10:05', dur: '5',  item: 'Welcome & notices',              person: 'Host',         mic: 'Handheld 1',       slides: 'Notices deck',   notes: '' },
    { time: '10:10', dur: '10', item: 'Sung worship — set 1',           person: 'Worship team', mic: 'All band + vocals', slides: 'ProPresenter',   notes: '3 songs; CCLI logged' },
    { time: '10:20', dur: '3',  item: 'Prayer',                         person: 'Elder',        mic: 'Handheld 2',       slides: 'Black',          notes: '' },
    { time: '10:23', dur: '7',  item: 'Sung worship — set 2',           person: 'Worship team', mic: 'All band + vocals', slides: 'ProPresenter',   notes: '2 songs' },
    { time: '10:30', dur: '5',  item: 'Bible reading',                  person: 'Reader',       mic: 'Handheld 1',       slides: 'Bible text',     notes: 'Luke 15:11–32' },
    { time: '10:35', dur: '30', item: 'Sermon',                         person: 'Speaker',      mic: 'Lapel',            slides: 'Sermon deck',    notes: 'Check clicker batteries' },
    { time: '11:05', dur: '5',  item: 'Response song',                  person: 'Worship team', mic: 'Vocals only',      slides: 'ProPresenter',   notes: 'Lower stage lighting' },
    { time: '11:10', dur: '5',  item: 'Communion',                      person: 'Elder',        mic: 'Handheld 2',       slides: 'Black',          notes: 'Elements pre-set on table' },
    { time: '11:15', dur: '3',  item: 'Closing song',                   person: 'Worship team', mic: 'All band + vocals', slides: 'ProPresenter',  notes: '' },
    { time: '11:18', dur: '2',  item: 'Blessing & dismissal',           person: 'Host',         mic: 'Handheld 1',       slides: 'Black',          notes: '' },
    { time: '11:20', dur: '',   item: 'Post-service music',             person: 'Sound team',   mic: 'BG music',         slides: 'Welcome loop',   notes: 'Fade out when hall clears' },
  ];

  let rows = JSON.parse(localStorage.getItem('runsheet_rows') || 'null') || DEFAULT_ROWS.map(r => ({...r}));
  let presenterIndex = 0;

  // ── Date default ──
  const dateInput = document.getElementById('serviceDate');
  const today = new Date();
  const day = today.getDay();
  const daysToSunday = day === 0 ? 0 : 7 - day;
  const sunday = new Date(today);
  sunday.setDate(today.getDate() + daysToSunday);
  dateInput.value = sunday.toISOString().split('T')[0];

  // ── Render ──
  function render() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    rows.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.dataset.index = i;
      tr.innerHTML = `
        <td class="time-col"><input class="cell time-cell" data-field="time" value="${esc(row.time)}" placeholder="10:00"></td>
        <td class="dur-col"><input class="cell dur-cell" data-field="dur" value="${esc(row.dur)}" placeholder="min"></td>
        <td class="item-col"><input class="cell" data-field="item" value="${esc(row.item)}" placeholder="Item"></td>
        <td class="person-col"><input class="cell" data-field="person" value="${esc(row.person)}" placeholder="Person"></td>
        <td class="mic-col"><input class="cell mic-cell" data-field="mic" value="${esc(row.mic)}" placeholder="Mic setup"></td>
        <td class="slides-col"><input class="cell slides-cell" data-field="slides" value="${esc(row.slides)}" placeholder="Slides"></td>
        <td class="notes-col"><input class="cell notes-cell" data-field="notes" value="${esc(row.notes)}" placeholder="Notes"></td>
        <td class="del-col"><button class="del-btn" data-i="${i}" title="Delete row">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
    highlightActive();
    attachListeners();
  }

  function esc(s) { return (s||'').replace(/"/g,'&quot;'); }

  function attachListeners() {
    document.querySelectorAll('#tbody input.cell').forEach(inp => {
      inp.addEventListener('input', e => {
        const tr = e.target.closest('tr');
        const i = parseInt(tr.dataset.index);
        rows[i][e.target.dataset.field] = e.target.value;
        save();
      });
    });
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        rows.splice(parseInt(btn.dataset.i), 1);
        save(); render();
      });
    });
  }

  function addRow() {
    rows.push({ time: '', dur: '', item: '', person: '', mic: '', slides: '', notes: '' });
    render();
    const inputs = document.querySelectorAll('#tbody tr:last-child input');
    if (inputs[0]) inputs[0].focus();
  }

  function save() { localStorage.setItem('runsheet_rows', JSON.stringify(rows)); }

  // ── Clock & active row ──
  function padZ(n) { return String(n).padStart(2, '0'); }

  function nowStr() {
    const n = new Date();
    return `${padZ(n.getHours())}:${padZ(n.getMinutes())}:${padZ(n.getSeconds())}`;
  }

  function timeToMins(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }

  function highlightActive() {
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const trs = document.querySelectorAll('#tbody tr');

    trs.forEach((tr, i) => {
      const row = rows[i];
      const start = timeToMins(row.time);
      const dur = parseInt(row.dur) || 0;
      const end = start !== null ? start + dur : null;

      tr.classList.remove('active-row', 'past-row');

      // Remove old countdown chips
      tr.querySelectorAll('.countdown').forEach(c => c.remove());

      if (start === null) return;

      if (end !== null && nowMins >= end) {
        tr.classList.add('past-row');
      } else if (nowMins >= start) {
        tr.classList.add('active-row');
        const elapsed = nowMins - start;
        const remaining = dur - elapsed;
        if (dur > 0) {
          const chip = document.createElement('span');
          chip.className = 'countdown ' + (remaining < 0 ? 'overrun' : 'live');
          chip.textContent = remaining < 0
            ? `+${Math.abs(remaining)}m over`
            : `${remaining}m left`;
          tr.querySelector('[data-field="item"]').after(chip);
        }
      } else {
        // Upcoming — show time-until for next item only
        const prevActive = [...trs].slice(0, i).some(t => t.classList.contains('active-row'));
        if (!prevActive) {
          const minsUntil = start - nowMins;
          if (minsUntil <= 15) {
            const chip = document.createElement('span');
            chip.className = 'countdown upcoming';
            chip.textContent = `in ${minsUntil}m`;
            tr.querySelector('[data-field="item"]').after(chip);
          }
        }
      }
    });
  }

  function tick() {
    const t = nowStr();
    document.getElementById('clock').textContent = t;
    document.getElementById('pClock').textContent = t;
    highlightActive();
    updatePresenterProgress();
  }

  setInterval(tick, 1000);
  tick();

  // ── Presenter mode ──
  function openPresenter() {
    // Find current or next item
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    let idx = rows.findIndex(r => {
      const s = timeToMins(r.time);
      const d = parseInt(r.dur) || 0;
      return s !== null && nowMins >= s && nowMins < s + d;
    });
    if (idx === -1) idx = rows.findIndex(r => timeToMins(r.time) > nowMins);
    if (idx === -1) idx = 0;
    presenterIndex = idx;
    renderPresenter();
    document.getElementById('presenter').classList.add('open');
    document.addEventListener('keydown', presenterKey);
  }

  function closePresenter() {
    document.getElementById('presenter').classList.remove('open');
    document.removeEventListener('keydown', presenterKey);
  }

  function presenterKey(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') presenterNav(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   presenterNav(-1);
    if (e.key === 'Escape') closePresenter();
  }

  function presenterNav(dir) {
    presenterIndex = Math.max(0, Math.min(rows.length - 1, presenterIndex + dir));
    renderPresenter();
  }

  function renderPresenter() {
    const row = rows[presenterIndex];
    const isLast = presenterIndex === rows.length - 1;
    const total = rows.length;

    document.getElementById('pLabel').textContent =
      `Item ${presenterIndex + 1} of ${total}`;
    document.getElementById('pItem').textContent = row.item || '—';
    document.getElementById('pPerson').textContent = row.person || '';

    const cues = document.getElementById('pCues');
    cues.innerHTML = '';
    if (row.time) {
      const c = document.createElement('div');
      c.className = 'p-cue';
      c.textContent = `🕐 ${row.time}${row.dur ? ` · ${row.dur}min` : ''}`;
      cues.appendChild(c);
    }
    if (row.mic) {
      const c = document.createElement('div');
      c.className = 'p-cue mic';
      c.textContent = `🎤 ${row.mic}`;
      cues.appendChild(c);
    }
    if (row.slides) {
      const c = document.createElement('div');
      c.className = 'p-cue slides';
      c.textContent = `🖥 ${row.slides}`;
      cues.appendChild(c);
    }
    if (row.notes) {
      const c = document.createElement('div');
      c.className = 'p-cue';
      c.textContent = `📝 ${row.notes}`;
      cues.appendChild(c);
    }
  }

  function updatePresenterProgress() {
    if (!document.getElementById('presenter').classList.contains('open')) return;
    const row = rows[presenterIndex];
    const start = timeToMins(row.time);
    const dur = parseInt(row.dur) || 0;
    if (start === null || dur === 0) {
      document.getElementById('pProgress').style.width = '0';
      return;
    }
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const frac = Math.min(1, Math.max(0, (nowMins - start) / dur));
    document.getElementById('pProgress').style.width = (frac * 100) + '%';
  }

  render();
</script>
</body>
</html>
